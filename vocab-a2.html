<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 English Vocabulary - Elementary Wordlist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; line-height: 1.5; padding: 20px 10px 60px; display: flex; justify-content: center; }

    .app-frame {
      width: 100%;
      max-width: 980px;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
    }

    header { background: #15803d; color: white; padding: 22px 18px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 13px; opacity: 0.95; }

    /* Хайлт ба шүүлтүүрийн самбар */
    .controls {
      padding: 16px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box { flex: 2; min-width: 240px; }
    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #15803d; }

    .filter-box { flex: 2; min-width: 240px; }
    .category-select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      outline: none;
      cursor: pointer;
    }
    .category-select:focus { border-color: #15803d; }

    .count-badge {
      font-size: 13px;
      font-weight: 600;
      color: #166534;
      background: #dcfce7;
      padding: 8px 14px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* Хүснэгтийн загвар */
    .table-container {
      overflow-x: auto;
      max-height: 75vh;
      overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      color: #475569;
      font-weight: 700;
      padding: 11px 14px;
      z-index: 2;
    }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tbody tr:hover { background-color: #f0fdf4; }

    .word-en { font-weight: 700; color: #0f172a; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
    .badge-cat { font-size: 11px; padding: 2px 6px; background: #f1f5f9; color: #64748b; border-radius: 4px; font-weight: 500; }
    .ipa { font-family: "Lucida Sans Unicode", sans-serif; color: #64748b; font-size: 12.5px; margin-right: 6px; }
    .trans-mn { color: #0284c7; font-weight: 600; font-size: 12.5px; background: #f0f9ff; padding: 1px 5px; border-radius: 3px; }
    .meaning { color: #1e293b; font-weight: 500; }

    .btn-audio {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      cursor: pointer;
      font-size: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-audio:hover {
      background: #15803d;
      color: white;
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div class="app-frame">

    <header>
      <h1>A2 English Vocabulary</h1>
      <p>Elementary түвшний сэдэвчилсэн үгийн сан (Дуудлага, Галиг, Орчуулга, Аудио)</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Үг хайх (Англи эсвэл Монголоор)..." oninput="filterWords()">
      </div>

      <div class="filter-box">
        <select id="catSelect" class="category-select" onchange="filterWords()">
          <option value="ALL">Бүх сэдэв (A2 Сан)</option>
          <option value="Home Appliances and Devices">1. Home Appliances & Devices</option>
          <option value="Clothes and Accessories">2. Clothes & Accessories</option>
          <option value="Colors and Shapes">3. Colors & Shapes</option>
          <option value="Computer and Information">4. Computer & Information</option>
          <option value="School and Education">5. School & Education</option>
          <option value="Animals">6. Animals</option>
          <option value="Appearance">7. Appearance</option>
          <option value="The Human Body">8. The Human Body</option>
          <option value="Conjunctions and Prepositions">9. Conjunctions & Prepositions</option>
          <option value="Communication">10. Communication</option>
          <option value="Cinema and Theater">11. Cinema & Theater</option>
          <option value="Music and Literature">12. Music & Literature</option>
          <option value="Family and Friends">13. Family & Friends</option>
          <option value="Restaurants and Food">14. Restaurants & Food</option>
          <option value="Health and Sickness">15. Health & Sickness</option>
          <option value="Hobbies and Daily Activities">16. Hobbies & Activities</option>
          <option value="Home">17. Home</option>
          <option value="Time and Date">18. Time & Date</option>
          <option value="Necessary Opposite Adjectives">19. Necessary Opposite Adjectives</option>
          <option value="Nature and Natural Disasters">20. Nature & Disasters</option>
          <option value="Money and Shopping">21. Money & Shopping</option>
          <option value="Jobs and Work">22. Jobs & Work</option>
          <option value="Sports">23. Sports</option>
          <option value="Tourism">24. Tourism</option>
          <option value="The Weather">25. The Weather</option>
          <option value="Quantity">26. Quantity</option>
          <option value="Countries and Nationalities">27. Countries & Nationalities</option>
          <option value="Languages and Grammar">28. Languages & Grammar</option>
          <option value="Basic Phrasal Verbs">29. Basic Phrasal Verbs</option>
          <option value="Flowers, Fruits, and Nuts">30. Flowers, Fruits & Nuts</option>
          <option value="Personality and Behavior">31. Personality & Behavior</option>
          <option value="Food">32. Food</option>
          <option value="Injuries and Sickness">33. Injuries & Sickness</option>
          <option value="Employment and Occupations">34. Employment & Occupations</option>
          <option value="Exercise and Matches">35. Exercise & Matches</option>
          <option value="Travelling">36. Travelling</option>
          <option value="Furniture and Household Items">37. Furniture & Household Items</option>
          <option value="City and the Countryside">38. City & Countryside</option>
          <option value="Measurement">39. Measurement</option>
          <option value="The Mind">40. The Mind</option>
          <option value="Essential Adverbs">41. Essential Adverbs</option>
          <option value="Essential Opposite Adjectives">42. Essential Opposite Adjectives</option>
          <option value="Emotions">43. Emotions</option>
          <option value="Modal and Other Verbs">44. Modal & Other Verbs</option>
          <option value="Mathematics">45. Mathematics</option>
          <option value="Science and the Natural World">46. Science & Nature</option>
          <option value="Necessary Verbs">47. Necessary Verbs</option>
          <option value="Common Verbs">48. Common Verbs</option>
          <option value="Essential Verbs">49. Essential Verbs</option>
          <option value="Pronouns and Determiners">50. Pronouns & Determiners</option>
        </select>
      </div>

      <span id="wordCount" class="count-badge">0 үг</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 25%;">Үг (Word)</th>
            <th style="width: 28%;">Дуудлага (IPA / Галиг)</th>
            <th style="width: 37%;">Монгол орчуулга</th>
            <th style="width: 10%; text-align: center;">Сонсох</th>
          </tr>
        </thead>
        <tbody id="vocabBody"></tbody>
      </table>
    </div>

  </div>

  <!-- A2 Өгөгдлийн сангийн файл -->
  <script src="vocab-data-a2.js"></script>

  <script>
    function renderTable(items) {
      const tbody = document.getElementById('vocabBody');
      tbody.innerHTML = '';

      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">Илэрц олдсонгүй.</td></tr>`;
        document.getElementById('wordCount').innerText = '0 үг';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
         <td>
  <div class="word-en">
    ${item.w}
  </div>
</td>
          <td>
            <span class="ipa">${item.ipa}</span>
            <span class="trans-mn">[${item.mn}]</span>
          </td>
          <td class="meaning">${item.tr}</td>
          <td style="text-align: center;">
            <button class="btn-audio" title="Дуудлага сонсох" onclick="speak('${item.w.replace(/'/g, "\\'")}')">🔊</button>
          </td>
        `;
        tbody.appendChild(row);
      });
      document.getElementById('wordCount').innerText = `${items.length} үг байна`;
    }

    function filterWords() {
      if (typeof VOCAB_DATA_A2 === 'undefined') return;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('catSelect').value;

      const filtered = VOCAB_DATA_A2.filter(item => {
        const matchCat = (selectedCat === 'ALL' || item.c === selectedCat);
        const matchSearch = item.w.toLowerCase().includes(query) || 
                            item.tr.toLowerCase().includes(query) || 
                            item.mn.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      renderTable(filtered);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.82;
        window.speechSynthesis.speak(u);
      } else {
        alert('Таны хөтөч дуу хоолой дэмжихгүй байна.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof VOCAB_DATA_A2 !== 'undefined') {
        renderTable(VOCAB_DATA_A2);
      }
    });
  </script>

  <script src="nav.js"></script>
</body>
</html>
