<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1 English Vocabulary - Бүх үгийн сан (Дуудлага, Галиг, Орчуулга)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; line-height: 1.5; padding: 20px 10px 60px; display: flex; justify-content: center; }

    .app-frame {
      width: 100%;
      max-width: 980px;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
    }

    header { background: #b83b26; color: white; padding: 22px 18px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 13px; opacity: 0.95; }

    /* Хайлт ба шүүлтүүрийн самбар */
    .controls {
      padding: 16px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box { flex: 2; min-width: 240px; }
    .search-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #b83b26; }

    .filter-box { flex: 2; min-width: 240px; }
    .category-select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      outline: none;
      cursor: pointer;
    }
    .category-select:focus { border-color: #b83b26; }

    .count-badge {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      background: #f1f5f9;
      padding: 8px 14px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* Хүснэгтийн загвар */
    .table-container {
      overflow-x: auto;
      max-height: 75vh;
      overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      color: #475569;
      font-weight: 700;
      padding: 11px 14px;
      z-index: 2;
    }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tbody tr:hover { background-color: #fff8f6; }

    .word-en { font-weight: 700; color: #0f172a; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
    .badge-cat { font-size: 11px; padding: 2px 6px; background: #f1f5f9; color: #64748b; border-radius: 4px; font-weight: 500; }
    .ipa { font-family: "Lucida Sans Unicode", sans-serif; color: #64748b; font-size: 12.5px; margin-right: 6px; }
    .trans-mn { color: #0284c7; font-weight: 600; font-size: 12.5px; background: #f0f9ff; padding: 1px 5px; border-radius: 3px; }
    .meaning { color: #1e293b; font-weight: 500; }

    .btn-audio {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b83b26;
      cursor: pointer;
      font-size: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-audio:hover {
      background: #b83b26;
      color: white;
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div class="app-frame">

    <header>
      <h1>A1 English Vocabulary</h1>
      <p>Сэдэвчилсэн бүх үгийн сан (Дуудлага, Монгол галиг, Орчуулга, Аудио)[]</p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Үг хайх (Англи эсвэл Монголоор)..." oninput="filterWords()">
      </div>

      <div class="filter-box">
        <select id="catSelect" class="category-select" onchange="filterWords()">
          <option value="ALL">Бүх сэдэв (520+ үг)</option>
          <option value="Hello and Goodbye">1. Hello & Goodbye (Мэндчилгээ)[]</option>
          <option value="People">2. People (Хүмүүс)[]</option>
          <option value="Numbers">3. Numbers (Тоо 0-100)[]</option>
          <option value="Family">4. Family (Гэр бүл)[]</option>
          <option value="Colors">5. Colors (Өнгө)[]</option>
          <option value="Months and Seasons">6. Months & Seasons (Сар, Улирал)[]</option>
          <option value="Time and Date">7. Time & Date (Цаг хугацаа)[]</option>
          <option value="Personal Information">8. Personal Information (Хувийн мэдээлэл)[]</option>
          <option value="The Body">9. The Body (Хүний бие)[]</option>
          <option value="The Head and Face">10. The Head and Face (Толгой, Нүүр)[]</option>
          <option value="Opposite Adjectives">11. Opposite Adjectives (Эсрэг тэмдэг нэрс)[]</option>
          <option value="House and Apartment">12. House & Apartment (Орон сууц)[]</option>
          <option value="Furniture">13. Furniture & Appliances (Тавилга)[]</option>
          <option value="Jobs">14. Jobs (Мэргэжил)[]</option>
          <option value="Clothes and Shoes">15. Clothes & Shoes (Хувцас, гутал)[]</option>
          <option value="Animals">16. Animals (Амьтад)[]</option>
          <option value="Basic Verbs">17. Basic Verbs (Суурь үйл үгс)[]</option>
          <option value="Household Items">18. Household Items (Гэр ахуйн хэрэгсэл)[]</option>
          <option value="Food and Ingredients">19. Food & Ingredients (Хүнс, орц)[]</option>
          <option value="Food and Drinks">20. Food & Drinks (Хоол, ундаа)[]</option>
          <option value="Describing People">21. Describing People (Хүнийг тодорхойлох)[]</option>
          <option value="Weather and Nature">22. Weather & Nature (Цаг агаар, байгаль)[]</option>
          <option value="Useful Verbs">23. Useful Verbs (Хэрэгцээт үйл үгс)[]</option>
          <option value="School">24. School (Сургууль, хичээлийн хэрэгсэл)[]</option>
          <option value="City">25. City (Хот, байгууллагууд)[]</option>
          <option value="Free Time">26. Free Time (Чөлөөт цаг, спорт)[]</option>
          <option value="Countries">27. Countries & Nationalities (Улс орнууд)[]</option>
          <option value="Simple Verbs">28. Simple Verbs (Энгийн үйл үгс)[]</option>
          <option value="Transportation">29. Transportation (Тээврийн хэрэгсэл)[]</option>
          <option value="Directions">30. Directions & Continents (Зүг чиг, тив)[]</option>
          <option value="Adverbs and Pronouns">31. Adverbs & Pronouns (Дайвар үг, төлөөний үг)[]</option>
          <option value="Prepositions">32. Prepositions & Determiners (Угтвар үгс)[]</option>
        </select>
      </div>

      <span id="wordCount" class="count-badge">0 үг</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 25%;">Үг (Word)</th>
            <th style="width: 28%;">Дуудлага (IPA / Галиг)</th>
            <th style="width: 37%;">Монгол орчуулга</th>
            <th style="width: 10%; text-align: center;">Сонсох</th>
          </tr>
        </thead>
        <tbody id="vocabBody"></tbody>
      </table>
    </div>

  </div>

  <!-- Өгөгдлийн сангийн файл -->
  <script src="vocab-data.js"></script>

  <script>
    function renderTable(items) {
      const tbody = document.getElementById('vocabBody');
      tbody.innerHTML = '';

      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">Илэрц олдсонгүй.</td></tr>`;
        document.getElementById('wordCount').innerText = '0 үг';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <div class="word-en">
              ${item.w}
              <span class="badge-cat">${item.c}</span>
            </div>
          </td>
          <td>
            <span class="ipa">${item.ipa}</span>
            <span class="trans-mn">[${item.mn}]</span>
          </td>
          <td class="meaning">${item.tr}</td>
          <td style="text-align: center;">
            <button class="btn-audio" title="Дуудлага сонсох" onclick="speak('${item.w.replace(/'/g, "\\'")}')">🔊</button>
          </td>
        `;
        tbody.appendChild(row);
      });
      document.getElementById('wordCount').innerText = `${items.length} үг байна`;
    }

    function filterWords() {
      if (typeof VOCAB_DATA === 'undefined') return;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('catSelect').value;

      const filtered = VOCAB_DATA.filter(item => {
        const matchCat = (selectedCat === 'ALL' || item.c === selectedCat);
        const matchSearch = item.w.toLowerCase().includes(query) || 
                            item.tr.toLowerCase().includes(query) || 
                            item.mn.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      renderTable(filtered);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.82;
        window.speechSynthesis.speak(u);
      } else {
        alert('Таны хөтөч дуу хоолой дэмжихгүй байна.');
      }
    }

    // Хуудас ачаалагдахад бүх үгийг дуудах
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof VOCAB_DATA !== 'undefined') {
        renderTable(VOCAB_DATA);
      }
    });
  </script>

  <script src="nav.js"></script>
</body>
</html>
